<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required autocomplete="off">
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" class="loading" style="display: none;">Processing...</p>
        <p id="answer"></p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea name="email" rows="5" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" class="loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

    </div>

    <footer class="footer">
        <p>Made By Biswajit ❤️</p>
    </footer>

<script>
    document.getElementById("askForm").onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector("button");
        const loading = document.getElementById("ans-loading");
        const answerEl = document.getElementById("answer");

        answerEl.innerText = "";
        answerEl.classList.remove("error");
        loading.style.display = "block";
        btn.disabled = true;

        try {
            const formData = new FormData(form);
            const res = await fetch("/ask", {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            if (!res.ok || data.error) {
                answerEl.classList.add("error");
                answerEl.innerText = data.error || "An unexpected error occurred.";
            } else {
                answerEl.innerText = data.response;
            }
        } catch (err) {
            answerEl.classList.add("error");
            answerEl.innerText = "Network error: Unable to reach the server. Please try again.";
        } finally {
            loading.style.display = "none";
            btn.disabled = false;
        }
    };

    document.getElementById("emailForm").onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector("button");
        const loading = document.getElementById("summary-loading");
        const summaryEl = document.getElementById("summary");

        summaryEl.innerText = "";
        summaryEl.classList.remove("error");
        loading.style.display = "block";
        btn.disabled = true;

        try {
            const formData = new FormData(form);
            const res = await fetch("/summarize", {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            if (!res.ok || data.error) {
                summaryEl.classList.add("error");
                summaryEl.innerText = data.error || "An unexpected error occurred.";
            } else {
                summaryEl.innerText = data.response;
            }
        } catch (err) {
            summaryEl.classList.add("error");
            summaryEl.innerText = "Network error: Unable to reach the server. Please try again.";
        } finally {
            loading.style.display = "none";
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
